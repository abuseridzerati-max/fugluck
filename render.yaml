# =============================================================================
# Fugluck Staging Backend Service Specification (Render Blueprint)
# =============================================================================
services:
  - type: web
    name: fugluck-api-staging
    runtime: node
    plan: free # Observed staging plan, not approved for commercial production.
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: DATABASE_REGION
        value: eu-central-1
      - key: DATABASE_TARGET_FINGERPRINT
        sync: false # SHA-256 of verified routing fields, never the password.
      - key: DATABASE_CA_CERT
        sync: false # Provider CA if required for certificate verification.
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: Staging PostgreSQL connection string
      - key: JWT_SECRET
        sync: false # Set in Render Dashboard: Random 64+ char secret string
      - key: CLIENT_ORIGIN
        value: https://staging.fugluck.com
      - key: ALLOWED_ORIGINS
        value: https://staging.fugluck.com
      - key: APP_URL
        value: https://staging.fugluck.com
      - key: COOKIE_SAMESITE
        value: lax
      - key: ENABLE_DEV_DIAMOND_STUB
        value: "false"
      - key: REAL_MONEY_ENABLED
        value: "false"
      - key: REAL_MONEY_DEPOSITS_ENABLED
        value: "false"
      - key: REAL_MONEY_WITHDRAWALS_ENABLED
        value: "false"
      - key: REAL_MONEY_COMPETITIONS_ENABLED
        value: "false"
      - key: EMAIL_PROVIDER
        value: logger
      - key: EMAIL_FROM
        value: Fugluck Staging <no-reply@fugluck.com>
