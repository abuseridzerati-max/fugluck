<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121218"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#26262f" stroke-width="8"/>

  <!-- Glowing outer ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#7c3aed" stroke-width="6" opacity="0.5" filter="url(#glow)"/>

  <!-- Stylized 'A' Emblem -->
  <!-- Left Leg -->
  <path d="M 160 390 L 235 120 L 277 120 L 202 390 Z" fill="url(#primaryGrad)"/>

  <!-- Right Leg -->
  <path d="M 352 390 L 277 120 L 235 120 L 310 390 Z" fill="url(#primaryGrad)"/>

  <!-- Apex Gem Crest -->
  <polygon points="256,90 280,140 232,140" fill="url(#cyanGrad)" filter="url(#glow)"/>

  <!-- Center Crossbar (Dynamic Clash Blade) -->
  <polygon points="175,290 337,290 315,325 197,325" fill="url(#goldGrad)"/>

  <!-- Accent Core Orb -->
  <circle cx="256" cy="220" r="22" fill="#00f3ff" filter="url(#glow)"/>
</svg>
